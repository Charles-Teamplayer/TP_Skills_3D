<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGI COUNCIL — 6-AXIS DELIBERATION</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --mel:#ff3c3c;--bal:#ffb428;--cas:#00c8ff;
  --urd:#a064f0;--ver:#f0b43c;--skl:#64dcf0;
  --bg:#020a08;--panel:#041210;--border:rgba(0,255,200,0.08);
  --text:rgba(0,255,200,0.7);--dim:rgba(0,255,200,0.25);
  --glow:rgba(0,255,200,0.15);
}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;overflow-x:hidden;min-height:100vh}
/* Scanlines */
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px)}
/* Vignette */
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.4) 100%)}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border)}
.header h1{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:4px;color:rgba(0,255,200,0.6);text-shadow:0 0 20px var(--glow)}
.header .sub{font-size:8px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px}
.session-info{font-size:8px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;text-align:right}
.session-id{color:rgba(0,255,200,0.5);font-size:9px}
.status-dot{width:6px;height:6px;border-radius:50%;background:#0f8;box-shadow:0 0 8px rgba(0,255,128,0.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Mode toggle */
.mode-toggle{display:flex;align-items:center;gap:0;border:1px solid rgba(0,255,200,0.15);border-radius:2px;overflow:hidden;cursor:pointer;user-select:none}
.mode-btn{font-family:'Orbitron',monospace;font-size:8px;font-weight:700;letter-spacing:2px;padding:4px 10px;
  background:transparent;color:var(--dim);border:none;cursor:pointer;transition:all 0.3s}
.mode-btn.active-live{background:rgba(0,255,128,0.15);color:#0f8;text-shadow:0 0 8px rgba(0,255,128,0.4)}
.mode-btn.active-sim{background:rgba(255,180,40,0.15);color:#ffb428;text-shadow:0 0 8px rgba(255,180,40,0.4)}

/* Live navigation */
.live-nav{display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity 0.3s}
.live-nav.visible{opacity:1;pointer-events:auto}
.nav-btn{font-family:'Orbitron',monospace;font-size:7px;font-weight:600;letter-spacing:1px;padding:3px 8px;
  background:transparent;color:var(--dim);border:1px solid rgba(0,255,200,0.1);border-radius:1px;cursor:pointer;transition:all 0.2s}
.nav-btn:hover{color:var(--text);border-color:rgba(0,255,200,0.3);background:rgba(0,255,200,0.05)}
.nav-btn:disabled{opacity:0.2;cursor:not-allowed}
.delib-counter{font-family:'Orbitron',monospace;font-size:8px;font-weight:600;letter-spacing:2px;color:rgba(0,255,200,0.5)}
.last-updated{font-size:6px;letter-spacing:1px;color:var(--dim);opacity:0.4;text-align:right;margin-top:1px}

/* Main layout */
.main{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:1px;padding:1px;background:var(--border)}
.main>*{background:var(--panel)}

/* Panel */
.panel{position:relative;overflow:hidden}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border)}
.panel-name{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:3px}
.panel-role{font-size:7px;letter-spacing:2px;text-transform:uppercase;opacity:0.4}
.panel-num{font-family:'Orbitron',monospace;font-size:9px;font-weight:900;opacity:0.2;position:absolute;top:6px;right:10px;font-size:28px}
.panel-bar{height:3px;width:100%}

/* Vote display */
.vote-section{padding:8px 12px 6px}
.vote-label{font-size:7px;letter-spacing:2px;text-transform:uppercase;opacity:0.3;margin-bottom:4px}
.vote-status{font-family:'Orbitron',monospace;font-size:10px;font-weight:600;letter-spacing:2px;display:flex;align-items:center;gap:6px}
.vote-icon{width:8px;height:8px;border-radius:1px}

/* Stats */
.stats{display:flex;gap:8px;padding:4px 12px 6px;flex-wrap:wrap}
.stat{flex:1;min-width:60px}
.stat-label{font-size:6px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.25;margin-bottom:2px}
.stat-val{font-family:'Orbitron',monospace;font-size:10px;font-weight:600}
.stat-bar{height:2px;margin-top:2px;border-radius:0;overflow:hidden;background:rgba(255,255,255,0.03)}
.stat-fill{height:100%;transition:width 1s ease}

/* Chat / Opinion stream */
.opinion-stream{padding:0 12px 8px;flex:1;overflow-y:auto;max-height:200px;min-height:120px}
.opinion-stream::-webkit-scrollbar{width:2px}
.opinion-stream::-webkit-scrollbar-thumb{background:rgba(0,255,200,0.08)}
.opinion{padding:5px 0;border-bottom:1px solid rgba(0,255,200,0.03);animation:fadeIn 0.5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.opinion-time{font-size:6px;opacity:0.2;letter-spacing:1px}
.opinion-text{font-size:8px;line-height:1.6;margin-top:2px;opacity:0.6}
.opinion-text.highlight{opacity:0.9}
.opinion-target{font-size:7px;opacity:0.3;margin-top:1px}
.opinion-target span{opacity:0.6}

/* Veto indicator */
.veto-zone{padding:4px 12px 6px;display:flex;align-items:center;gap:6px}
.veto-label{font-size:7px;letter-spacing:2px;text-transform:uppercase;opacity:0.3}
.veto-status{font-family:'Orbitron',monospace;font-size:8px;font-weight:600;letter-spacing:1px}
.veto-active{color:#ff3c3c;text-shadow:0 0 8px rgba(255,60,60,0.4)}
.veto-clear{color:rgba(0,255,200,0.3)}

/* Center deliberation panel */
.deliberation{grid-column:1/-1;border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:20px;align-items:flex-start}
.delib-left{flex:1}
.delib-title{font-family:'Orbitron',monospace;font-size:9px;font-weight:600;letter-spacing:3px;color:rgba(0,255,200,0.4);margin-bottom:8px;text-transform:uppercase}
.agenda-text{font-size:10px;line-height:1.8;color:rgba(0,255,200,0.7);margin-bottom:8px}
.agenda-meta{font-size:7px;opacity:0.25;letter-spacing:1.5px;text-transform:uppercase}

/* Vote tally */
.delib-right{width:280px}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tally-item{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid rgba(255,255,255,0.03);border-radius:1px;font-size:8px;letter-spacing:1px}
.tally-dot{width:5px;height:5px;border-radius:1px;flex-shrink:0}
.tally-name{flex:1;text-transform:uppercase;opacity:0.5}
.tally-vote{font-family:'Orbitron',monospace;font-size:8px;font-weight:600}

/* Verdict */
.verdict{margin-top:8px;padding:6px 10px;border:1px solid;border-radius:1px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:3px;text-align:center}
.verdict.approved{border-color:rgba(0,255,128,0.3);color:#0f8;background:rgba(0,255,128,0.03);text-shadow:0 0 10px rgba(0,255,128,0.3)}
.verdict.rejected{border-color:rgba(255,60,60,0.3);color:#f44;background:rgba(255,60,60,0.03)}
.verdict.hold{border-color:rgba(255,180,40,0.3);color:#fb0;background:rgba(255,180,40,0.03)}
.verdict.deliberating{border-color:rgba(0,255,200,0.15);color:rgba(0,255,200,0.4);background:rgba(0,255,200,0.02);animation:pulse 2s infinite}

/* Verdict reason (LIVE mode) */
.verdict-reason{font-size:7px;letter-spacing:1px;opacity:0.35;margin-top:4px;text-align:center;line-height:1.6}

/* Corner marks */
.corner-marks{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.cm{position:absolute;width:8px;height:8px;opacity:0.15}
.cm-tl{top:2px;left:2px;border-top:1px solid;border-left:1px solid}
.cm-tr{top:2px;right:2px;border-top:1px solid;border-right:1px solid}
.cm-bl{bottom:2px;left:2px;border-bottom:1px solid;border-left:1px solid}
.cm-br{bottom:2px;right:2px;border-bottom:1px solid;border-right:1px solid}

/* Bottom bar */
.bottom-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 20px;border-top:1px solid var(--border);font-size:7px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.2}

/* Cross-talk indicator */
.cross-talk{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:50;
  font-size:8px;letter-spacing:2px;text-transform:uppercase;opacity:0;
  padding:4px 16px;border:1px solid rgba(0,255,200,0.1);background:rgba(0,12,10,0.9);
  transition:opacity 0.3s;border-radius:1px}
.cross-talk.show{opacity:1}

/* Responsive */
@media(max-width:900px){.main{grid-template-columns:1fr 1fr}.deliberation{grid-column:1/-1}}
@media(max-width:600px){.main{grid-template-columns:1fr}.deliberation{flex-direction:column}.delib-right{width:100%}.header{flex-wrap:wrap;gap:8px}.header-right{flex-wrap:wrap}}
</style>
</head>

function startAgenda(){

  currentAgenda = AGENDAS[idx];
  deliberationPhase = 0;
  votes = {};
  phaseTimer = 0;

  document.getElementById('agendaText').textContent = currentAgenda.text;
  document.getElementById('agendaMeta').textContent = 'TYPE: '+currentAgenda.type.toUpperCase()+' \u00b7 RISK: '+currentAgenda.risk.toUpperCase()+' \u00b7 PHASE: INITIALIZING';
  document.getElementById('verdict').className = 'verdict deliberating';

function addOpinion(axIdx, text, targetName){
  var ax = AXES[axIdx];
  var stream = document.getElementById('stream-'+ax.id);
  var div = document.createElement('div');
  div.className = 'opinion';
  var now = new Date();
  var timeStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  var html = '<div class="opinion-time">'+timeStr+'</div><div class="opinion-text'+(targetName?'':' highlight')+'">'+text+'</div>';
  if(targetName) html += '<div class="opinion-target">\u2192 <span>'+targetName+'</span></div>';
  div.innerHTML = html;
  stream.insertBefore(div, stream.firstChild);
  while(stream.children.length > 8) stream.removeChild(stream.lastChild);
}

function addOpinionWithTime(axIdx, text, targetName, timeStr){

function showCrossTalk(from, to, text){

  ct.innerHTML = '<span style="color:'+from.color+'">'+from.name+'</span> \u2192 <span style="color:'+to.color+'">'+to.name+'</span>: '+text;
  ct.classList.add('show');
  setTimeout(function(){ct.classList.remove('show');}, 3000);
}

function castVote(axIdx, vote){
  var ax = AXES[axIdx];
  votes[ax.id] = vote;
  var voteEl = document.getElementById('vote-'+ax.id);
  var tvEl = document.getElementById('tv-'+ax.id);

  if(vote === 'approve'){
    voteEl.innerHTML = '<div class="vote-icon" style="background:#0f8"></div><span style="color:#0f8">APPROVE</span>';
    tvEl.textContent = 'APR'; tvEl.style.color = '#0f8';
  } else if(vote === 'reject'){
    voteEl.innerHTML = '<div class="vote-icon" style="background:#f44"></div><span style="color:#f44">REJECT</span>';
    tvEl.textContent = 'REJ'; tvEl.style.color = '#f44';
  } else if(vote === 'conditional'){
    voteEl.innerHTML = '<div class="vote-icon" style="background:#fb0"></div><span style="color:#fb0">CONDITIONAL</span>';
    tvEl.textContent = 'CND'; tvEl.style.color = '#fb0';
  } else if(vote === 'hold'){
    voteEl.innerHTML = '<div class="vote-icon" style="background:#f80"></div><span style="color:#f80">HOLD</span>';
    tvEl.textContent = 'HLD'; tvEl.style.color = '#f80';
  }
}

function activateVeto(axIdx){
  var ax = AXES[axIdx];
  var vetoEl = document.getElementById('veto-'+ax.id);
  vetoEl.textContent = 'ACTIVE \u2014 '+ax.veto;
  vetoEl.className = 'veto-status veto-active';
}

function getVoteForAgenda(axIdx, agenda){
  var ax = AXES[axIdx];
  var risk = agenda.risk;
  var type = agenda.type;

  if(ax.id === 'melchior'){
    if(type==='nogo') return 'approve';
    if(type==='security' || type==='refactor') return 'approve';
    if(type==='deploy' && risk==='high') return 'conditional';
    if(risk==='low') return 'approve';
    return Math.random()>0.3?'approve':'conditional';
  }
  if(ax.id === 'balthazar'){
    if(type==='nogo') return 'reject';
    if(type==='cost') return 'approve';
    if(type==='debt' || type==='refactor') return Math.random()>0.5?'conditional':'approve';
    if(risk==='high') return 'conditional';
    return Math.random()>0.2?'approve':'conditional';
  }
  if(ax.id === 'casper'){
    if(type==='nogo') return 'reject';
    if(risk==='high') return 'conditional';
    if(type==='deploy') return Math.random()>0.4?'conditional':'approve';
    if(type==='architecture') return 'conditional';
    return Math.random()>0.3?'approve':'conditional';
  }
  if(ax.id === 'urd'){
    if(type==='docs') return 'approve';
    if(type==='deploy' && risk==='high') return 'hold';
    return Math.random()>0.2?'approve':'conditional';
  }
  if(ax.id === 'verdandi'){
    if(type==='deploy' && risk==='high') return 'conditional';
    if(type==='qa') return 'approve';
    if(risk==='high') return 'conditional';
    return Math.random()>0.3?'approve':'conditional';
  }
  if(ax.id === 'skuld'){
    if(type==='architecture') return 'conditional';
    if(type==='refactor') return 'approve';
    if(risk==='high') return 'hold';
    return Math.random()>0.3?'approve':'conditional';
  }
  return 'approve';
}

function resolveVerdict(){
  var approves=0, rejects=0, holds=0;
  ['melchior','balthazar','casper'].forEach(function(id){
    var v = votes[id];
    if(v==='approve'||v==='conditional') approves++;
    if(v==='reject') rejects++;
  });
  var nornHold = false;
  ['urd','verdandi','skuld'].forEach(function(id){
    if(votes[id]==='hold'){nornHold=true;holds++;}
  });

  var verdictEl = document.getElementById('verdict');
  if(nornHold){
    verdictEl.className='verdict hold';
    verdictEl.textContent='HOLD \u2014 NORN VETO';
  } else if(rejects>=2){
    verdictEl.className='verdict rejected';
    verdictEl.textContent='REJECTED';
  } else if(approves>=2){
    verdictEl.className='verdict approved';
    verdictEl.textContent='APPROVED';
  } else {
    verdictEl.className='verdict hold';
    verdictEl.textContent='CEO ESCALATION';
  }
}

// === SIMULATION LOOP ===
var simStep = 0;
function simTick(){
  if(currentMode !== 'sim') return;
  if(!currentAgenda){startAgenda();return;}

  phaseTimer++;
  var meta = document.getElementById('agendaMeta');

  if(deliberationPhase === 0){
    meta.textContent = 'TYPE: '+currentAgenda.type.toUpperCase()+' \u00b7 RISK: '+currentAgenda.risk.toUpperCase()+' \u00b7 PHASE: 1/3 \u2014 POSITION STATEMENTS';
    if(phaseTimer <= 6){
      var axIdx = phaseTimer - 1;
      if(axIdx < AXES.length){
        var q = AXES[axIdx].quotes[Math.floor(Math.random()*AXES[axIdx].quotes.length)];
        addOpinion(axIdx, q);
      }
    }
    if(phaseTimer >= 8){deliberationPhase=1;phaseTimer=0;}
  }
  else if(deliberationPhase === 1){
    meta.textContent = 'TYPE: '+currentAgenda.type.toUpperCase()+' \u00b7 RISK: '+currentAgenda.risk.toUpperCase()+' \u00b7 PHASE: 2/3 \u2014 CROSS DEBATE';
    if(phaseTimer % 2 === 0){
      var fromIdx = Math.floor(Math.random()*AXES.length);
      var toIdx;
      do{toIdx = Math.floor(Math.random()*AXES.length);}while(toIdx===fromIdx);
      var from = AXES[fromIdx], to = AXES[toIdx];
      var key = 'to_'+to.id.substring(0,3);
      var reactions = from.reactions[key];
      if(reactions && reactions.length>0){
        var text = reactions[Math.floor(Math.random()*reactions.length)];
        addOpinion(fromIdx, text, to.name);
        showCrossTalk(from, to, text.substring(0,50)+'...');
      }
    }
    if(phaseTimer >= 14){deliberationPhase=2;phaseTimer=0;}
  }
  else if(deliberationPhase === 2){
    meta.textContent = 'TYPE: '+currentAgenda.type.toUpperCase()+' \u00b7 RISK: '+currentAgenda.risk.toUpperCase()+' \u00b7 PHASE: 3/3 \u2014 VOTING';
    if(phaseTimer <= 6){
      var axIdx = phaseTimer - 1;
      if(axIdx < AXES.length){
        var vote = getVoteForAgenda(axIdx, currentAgenda);
        castVote(axIdx, vote);
        var rx = AXES[axIdx].reactions;
        if(vote==='approve'||vote==='conditional'){
          var t = rx.agree[Math.floor(Math.random()*rx.agree.length)];
          addOpinion(axIdx, t);
        } else if(vote==='reject'){
          var t = rx.disagree[Math.floor(Math.random()*rx.disagree.length)];
          addOpinion(axIdx, t);
        } else if(vote==='hold'){
          activateVeto(axIdx);
          addOpinion(axIdx, '\uac70\ubd80\uad8c \ubc1c\ub3d9: '+AXES[axIdx].veto);
        }
      }
    }
    if(phaseTimer === 8){resolveVerdict();}
    if(phaseTimer >= 14){deliberationPhase=3;phaseTimer=0;}
  }
  else if(deliberationPhase === 3){
    meta.textContent = 'TYPE: '+currentAgenda.type.toUpperCase()+' \u00b7 RISK: '+currentAgenda.risk.toUpperCase()+' \u00b7 NEXT AGENDA IN '+(10-phaseTimer)+'s';
    if(phaseTimer >= 10){
      sessionNum++;
      document.getElementById('sessionId').textContent = 'SESSION #'+sessionNum;
      startAgenda();
    }
  }

  if(simStep % 5 === 0){
    AXES.forEach(function(ax){
      var keys = Object.keys(ax.stats);
      var k = keys[Math.floor(Math.random()*keys.length)];
      ax.stats[k] = Math.max(50, Math.min(99, ax.stats[k] + Math.floor(Math.random()*7)-3));
      var statEls = document.getElementById('stats-'+ax.id).querySelectorAll('.stat');
      var idx = keys.indexOf(k);
      if(statEls[idx]){
        statEls[idx].querySelector('.stat-val').textContent = ax.stats[k]+'%';
        statEls[idx].querySelector('.stat-fill').style.width = ax.stats[k]+'%';
      }
    });
  }

  simStep++;
}

function fetchDeliberations(){
  return fetch('deliberations.json?t='+Date.now())
    .then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    })
    .then(function(data){
      // Support both formats: array or {deliberations: [...]}
      var arr = null;
      if(Array.isArray(data) && data.length > 0){
        arr = data;
      } else if(data && Array.isArray(data.deliberations) && data.deliberations.length > 0){
        arr = data.deliberations;
      }
      if(arr){
        liveData = arr;
        return true;
      }
      return false;
    })
    .catch(function(err){
      console.warn('[MAGI LIVE] deliberations.json \ub85c\ub4dc \uc2e4\ud328:', err.message);
      return false;
    });
}

function clearAllStreams(){
  AXES.forEach(function(ax){
    var stream = document.getElementById('stream-'+ax.id);
    stream.innerHTML = '';
  });
}

function renderLiveDeliberation(delib){
  if(!delib) return;

  // Session ID — support both session_id and sessionId
  document.getElementById('sessionId').textContent = delib.session_id || delib.sessionId || delib.id;

  // Agenda — support both {text} and {title, description}
  document.getElementById('delibTitle').textContent = 'DELIBERATION RECORD';
  var agendaDisplay = delib.agenda.text || (delib.agenda.title + ' \u2014 ' + (delib.agenda.description || ''));
  document.getElementById('agendaText').textContent = agendaDisplay;

  // Timestamp
  var ts = delib.timestamp ? new Date(delib.timestamp) : null;
  var tsStr = ts ? (ts.getFullYear()+'.'+String(ts.getMonth()+1).padStart(2,'0')+'.'+String(ts.getDate()).padStart(2,'0')+' '
    +String(ts.getHours()).padStart(2,'0')+':'+String(ts.getMinutes()).padStart(2,'0')) : '';

  var metaParts = ['ID: '+delib.id];
  if(delib.agenda.type) metaParts.push('TYPE: '+delib.agenda.type.toUpperCase());
  if(delib.agenda.risk) metaParts.push('RISK: '+delib.agenda.risk.toUpperCase());
  if(delib.agenda.project) metaParts.push('PROJECT: '+delib.agenda.project);
  if(tsStr) metaParts.push(tsStr);
  document.getElementById('agendaMeta').textContent = metaParts.join(' \u00b7 ');

  // Clear streams
  clearAllStreams();

  // Reset all panels
  AXES.forEach(function(ax){
    document.getElementById('vote-'+ax.id).innerHTML = '<div class="vote-icon" style="background:rgba('+ax.rgb+',0.3)"></div><span style="color:'+ax.color+';opacity:0.5">STANDBY</span>';
    document.getElementById('tv-'+ax.id).textContent = '\u2014';
    document.getElementById('tv-'+ax.id).style.color = ax.color;
    document.getElementById('veto-'+ax.id).textContent = 'CLEAR';
    document.getElementById('veto-'+ax.id).className = 'veto-status veto-clear';
  });

  var timeBase = ts || new Date();

  // Phase 1: Position statements — support both "position" and "statements"
  var statements = (delib.phases && (delib.phases.position || delib.phases.statements)) || [];
  statements.forEach(function(p, i){
    var axIdx = AXIS_MAP[p.axis];
    if(axIdx !== undefined){
      var t = new Date(timeBase.getTime() + i*2000);
      var tStr = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
      addOpinionWithTime(axIdx, p.text, null, tStr);
    }
  });

  // Phase 2: Cross-debate — support both "crossDebate" and "cross_debate"
  var crossDebate = (delib.phases && (delib.phases.crossDebate || delib.phases.cross_debate)) || [];
  crossDebate.forEach(function(cd, i){
    var fromAx = getAxisByName(cd.from);
    var toTarget = cd.to;
    var toName = toTarget;
    if(toTarget !== 'all'){
      var toAx = getAxisByName(toTarget);
      if(toAx) toName = toAx.name;
    } else {
      toName = 'ALL';
    }
    if(fromAx){
      var fromIdx = AXIS_MAP[fromAx.id];
      var t = new Date(timeBase.getTime() + (statements.length*2 + i*3)*1000);
      var tStr = String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
      addOpinionWithTime(fromIdx, cd.text, toName, tStr);
    }
  });

  // Phase 3: Votes — support both object map {axis: vote} and array [{axis, vote}]
  if(delib.phases && delib.phases.votes){
    var voteData = delib.phases.votes;
    if(Array.isArray(voteData)){
      // Array format: [{axis, vote, score, reason/condition}]
      voteData.forEach(function(v){
        var axIdx = AXIS_MAP[v.axis];
        if(axIdx !== undefined){
          castVote(axIdx, v.vote);
          if(v.vote === 'hold' || v.vote === 'reject'){
            // Check if this axis has a veto in verdict
            var hasVeto = delib.verdict && delib.verdict.vetoes && delib.verdict.vetoes.some(function(vt){ return vt.axis === v.axis; });
            if(hasVeto){
              var ax = AXES[axIdx];
              var vetoEl = document.getElementById('veto-'+ax.id);
              var vetoDetail = delib.verdict.vetoes.find(function(vt){ return vt.axis === v.axis; });
              vetoEl.textContent = 'ACTIVE \u2014 '+(vetoDetail.type || ax.veto);
              vetoEl.className = 'veto-status veto-active';
            }
          }
        }
      });
    } else {
      // Object map format: {melchior: "approve", ...}
      AXES.forEach(function(ax, idx){
        var v = voteData[ax.id];
        if(v){
          castVote(idx, v);
          if(v === 'hold'){
            activateVeto(idx);
          }
        }
      });
    }
  }

  // Verdict
  var verdictEl = document.getElementById('verdict');
  var reasonEl = document.getElementById('verdictReason');
  if(delib.verdict){
    var r = delib.verdict.result;
    if(r === 'approved'){
      verdictEl.className = 'verdict approved';
    } else if(r === 'rejected'){
      verdictEl.className = 'verdict rejected';
    } else if(r === 'hold'){
      verdictEl.className = 'verdict hold';
    } else {
      verdictEl.className = 'verdict deliberating';
    }
    // Display text: prefer .text, then construct from result
    var displayText = delib.verdict.text || r.toUpperCase();
    if(!delib.verdict.text && delib.verdict.vetoes && delib.verdict.vetoes.length > 0){
      displayText = r.toUpperCase() + ' \u2014 ' + delib.verdict.vetoes[0].type;
    }
    verdictEl.textContent = displayText;
    // Reason: prefer .reason, then .summary
    reasonEl.textContent = delib.verdict.reason || delib.verdict.summary || '';
  }

  // Update counter
  updateDelibCounter();
}

function updateDelibCounter(){
  var counter = document.getElementById('delibCounter');
  if(liveData.length === 0){
    counter.textContent = 'NO DATA';
  } else {
    counter.textContent = 'DELIB '+(liveIndex+1)+'/'+liveData.length;
  }
}

function navigateDelib(dir){
  if(liveData.length === 0) return;
  var newIdx = liveIndex + dir;
  if(newIdx < 0) newIdx = 0;
  if(newIdx >= liveData.length) newIdx = liveData.length - 1;
  if(newIdx !== liveIndex){
    liveIndex = newIdx;
    renderLiveDeliberation(liveData[liveIndex]);
  }
  // Update button states
  document.getElementById('btnPrev').disabled = (liveIndex <= 0);
  document.getElementById('btnNext').disabled = (liveIndex >= liveData.length - 1);
}

function updateLastUpdated(){
  var now = new Date();
  var str = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  document.getElementById('lastUpdated').textContent = 'LAST UPDATED: '+str;
}

function switchMode(mode){
  if(mode === currentMode) return;
  currentMode = mode;

  var btnLive = document.getElementById('btnLive');
  var btnSim = document.getElementById('btnSim');
  var liveNav = document.getElementById('liveNav');
  var statusDot = document.getElementById('statusDot');
  var delibTitle = document.getElementById('delibTitle');
  var reasonEl = document.getElementById('verdictReason');

  if(mode === 'live'){
    btnLive.className = 'mode-btn active-live';
    btnSim.className = 'mode-btn';
    liveNav.classList.add('visible');
    statusDot.style.background = '#0f8';

    // Stop sim
    if(simIntervalId){ clearInterval(simIntervalId); simIntervalId = null; }

    // Fetch and render
    fetchDeliberations().then(function(ok){
      if(ok && liveData.length > 0){
        liveIndex = liveData.length - 1; // most recent
        renderLiveDeliberation(liveData[liveIndex]);
        document.getElementById('btnPrev').disabled = (liveIndex <= 0);
        document.getElementById('btnNext').disabled = (liveIndex >= liveData.length - 1);
        updateLastUpdated();
      } else {
        document.getElementById('agendaText').textContent = '\uc2e4\uc81c \uc2ec\uc758 \ub370\uc774\ud130\uac00 \uc5c6\uc2b5\ub2c8\ub2e4. deliberations.json\uc744 \ud655\uc778\ud558\uc138\uc694.';
        document.getElementById('agendaMeta').textContent = 'SIM \ubaa8\ub4dc\ub85c \uc804\ud658\ud558\uc5ec \uc2dc\ubbac\ub808\uc774\uc158\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4';
        document.getElementById('delibCounter').textContent = 'NO DATA';
      }
    });

    // Auto-refresh every 30s
    if(liveRefreshTimer) clearInterval(liveRefreshTimer);
    liveRefreshTimer = setInterval(function(){
      if(currentMode !== 'live') return;
      var prevLen = liveData.length;
      fetchDeliberations().then(function(ok){
        if(ok){
          updateLastUpdated();
          // If new data arrived and user is on the last item, auto-navigate
          if(liveData.length > prevLen && liveIndex === prevLen - 1){
            liveIndex = liveData.length - 1;
            renderLiveDeliberation(liveData[liveIndex]);
            document.getElementById('btnPrev').disabled = (liveIndex <= 0);
            document.getElementById('btnNext').disabled = (liveIndex >= liveData.length - 1);
          } else {
            updateDelibCounter();
          }
        }
      });
    }, 30000);

  } else { // sim
    btnLive.className = 'mode-btn';
    btnSim.className = 'mode-btn active-sim';
    liveNav.classList.remove('visible');
    statusDot.style.background = '#0f8';
    delibTitle.textContent = 'CURRENT AGENDA';
    reasonEl.textContent = '';
    document.getElementById('lastUpdated').textContent = '';

    // Stop live refresh
    if(liveRefreshTimer){ clearInterval(liveRefreshTimer); liveRefreshTimer = null; }

    // Clear and restart sim
    clearAllStreams();
    currentAgenda = null;
    deliberationPhase = 0;
    phaseTimer = 0;
    simStep = 0;
    sessionNum = Math.floor(Math.random()*900)+100;
    document.getElementById('sessionId').textContent = 'SESSION #'+sessionNum;
    startAgenda();
    if(!simIntervalId){
      simIntervalId = setInterval(simTick, 1500);
    }
  }
}

// ==============================
// === CLOCK ===
// ==============================
function updateClock(){
  var now=new Date();
  document.getElementById('clock').textContent=
    now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0')+' '
    +String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
}
setInterval(updateClock,1000);updateClock();

// ==============================
// === BOOT ===
// ==============================
// Try to load live data on start. If available, auto-switch to LIVE. Otherwise stay in SIM.
fetchDeliberations().then(function(ok){
  if(ok && liveData.length > 0){
    // Data exists - start in LIVE mode
    switchMode('live');
  } else {
    // No data - start in SIM mode (default)
    startAgenda();
    simIntervalId = setInterval(simTick, 1500);
  }
}).catch(function(){
  startAgenda();
  simIntervalId = setInterval(simTick, 1500);
});
</script>

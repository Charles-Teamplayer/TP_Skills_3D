<body>
<div id="scanlines"></div>

<div id="ui">

  <button onclick="resetCam()">RESET</button>
  <button id="bTheme" onclick="toggleTheme()">DAY MODE</button>
  <button id="bOutline" onclick="toggleOutline()">OUTLINE</button>
  <button onclick="window.location.href='council.html'">COUNCIL</button>
</div>
<div id="search-box">
  <div style="position:relative">
    <span id="search-icon">&#x2315;</span>
    <input id="search-input" type="text" placeholder="SEARCH NODES... (CTRL+F)">
  </div>

</div>

</div>

  <h1>MAGI SYSTEM</h1>
  <div class="sub">TEAMPLAYER.INC &middot; TP_skills v2.1</div>
</div>

  <div class="magi-item m-mel"><span>MELCHIOR-1 &middot; TECH</span><div class="magi-dot"></div></div>
  <div class="magi-item m-bal"><span>BALTHASAR-2 &middot; BIZ</span><div class="magi-dot"></div></div>

<script>
var C=document.createElement('canvas');document.body.appendChild(C);
var G=C.getContext('2d');var W,H,DPR;
// themeMode: 0=AUTO, 1=DAY, 2=NIGHT
var themeMode=0;
var isDark=(function(){var h=new Date().getHours();return h<7||h>=19;})();
if(!isDark)document.body.className='light';
function applyTheme(){
  document.body.className=isDark?'':'light';
  var btn=document.getElementById('bTheme');
  if(themeMode===0)btn.textContent='AUTO ('+(isDark?'NIGHT':'DAY')+')';
  else if(themeMode===1)btn.textContent='DAY';
  else btn.textContent='NIGHT';
}
function toggleTheme(){
  themeMode=(themeMode+1)%3;
  if(themeMode===0){var h=new Date().getHours();isDark=h<7||h>=19;}
  else if(themeMode===1){isDark=false;}
  else{isDark=true;}
  applyTheme();
}
// Auto theme check every 60s
setInterval(function(){
  if(themeMode!==0)return;
  var h=new Date().getHours();var shouldDark=h<7||h>=19;
  if(shouldDark!==isDark){isDark=shouldDark;applyTheme();}
},60000);
applyTheme();
function resize(){DPR=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px';G.setTransform(DPR,0,0,DPR,0,0);}
resize();window.addEventListener('resize',resize);

// === SKILL USAGE DATA ===
var USAGE={};var MAX_USAGE=1;
(function loadUsage(){
  var x=new XMLHttpRequest();
  x.open('GET','skill_usage.json?t='+Date.now(),true);
  x.onload=function(){
    if(x.status===200){try{var d=JSON.parse(x.responseText);USAGE=d.skills||{};var mx=1;for(var k in USAGE){if(USAGE[k].count>mx)mx=USAGE[k].count;}MAX_USAGE=mx;}catch(e){}}
  };x.send();
})();
function getUsage(id){
  var m={'pj01':'01_imsms_console','pj02':'02_imsms_backend','pj03':'03_imsms_agent','pj04':'04_mdm','pj05':'05_imsms_demo','pj06':'06_imsms_website','pj10':'10_ai_chatbot','pj20':'20_teamplayer_site','pj30':'30_iros_extractor','pj31':'31_auto_contact','pj36':'36_a_imessage_claude','pj50':'50_session_manager','system':'index','ceo_rules':'ceo_protocol','charter':'magi_workflow_charter','qa_system':'qa_process','magi':'magi_analysis','team':'multi_agent_team'};
  return USAGE[m[id]||id]||null;
}

// === EVA MAGI COLOR PALETTE ===
var COL={
  system:[0,255,200],magi:[255,60,60],team:[0,200,255],
  dev_team:[0,180,255],qa_team:[255,180,40],pm_team:[0,255,160],
  deploy_policy:[100,200,220],presets:[200,200,80],
  process:[255,200,50],ceo_rules:[255,80,80],
  qa_system:[255,180,40],hooks:[0,220,200],
  charter:[140,180,255],projects:[255,100,80],
  imsms_core:[255,80,60],others:[220,120,80],
  files:[120,200,180],
  norn:[180,120,255],tools_gov:[255,160,100],
  urd:[160,100,240],verdandi:[240,180,60],skuld:[100,220,240],
  melchior:[255,60,60],balthazar:[255,180,40],casper:[0,200,255],
  council:[255,200,100]
};
var COL_DAY={
  system:[0,130,90],magi:[200,20,20],team:[0,100,180],
  dev_team:[0,90,170],qa_team:[190,120,0],pm_team:[0,140,80],
  deploy_policy:[30,120,140],presets:[140,140,20],
  process:[180,130,0],ceo_rules:[200,30,30],
  qa_system:[190,120,0],hooks:[0,140,120],
  charter:[60,100,200],projects:[200,50,30],
  imsms_core:[200,40,20],others:[180,70,30],
  files:[40,130,110],
  norn:[120,60,180],tools_gov:[190,100,50],
  urd:[100,50,170],verdandi:[180,120,10],skuld:[30,140,160],
  melchior:[200,20,20],balthazar:[190,120,0],casper:[0,100,180],
  council:[180,140,50]
};
function gc(n){var p=isDark?COL:COL_DAY;return p[n.pg]||p[n.gid]||(isDark?[0,255,200]:[0,130,90]);}

// === NODE DATA ===
var ALL=[];var EDGES=[];
ALL.push({id:'system',t:'MAGI SYSTEM\nTEAMPLAYER.INC',d:'TP_skills v2.1 기반 작업 체계',gid:'system',pg:'system',layer:0,sz:2.5});

var L1=[
  {id:'magi',t:'MAGI 3-AXIS',d:'프로젝트 분석/의사결정\nMELCHIOR · BALTHASAR · CASPER'},
  {id:'norn',t:'NORN 3-AXIS',d:'자문 + 거부권\nURD · VERDANDI · SKULD'},
  {id:'tools_gov',t:'TOOL\nGOVERNANCE',d:'도구별 권한 관리\nRalph Loop · /simplify'},
  {id:'team',t:'AGENT TEAM\n(10 UNITS)',d:'간단 1줄 수정 외\n모든 작업에 필수 투입'},
  {id:'process',t:'WORK PROCESS',d:'CEO 지시→실행→보고'},
  {id:'ceo_rules',t:'CEO PROTOCOL\n(9 RULES)',d:'CEO는 바꾸지 않는다\nClaude가 100% 적응'},
  {id:'qa_system',t:'QA SYSTEM',d:'브라우저 검증 3단계'},
  {id:'hooks',t:'AUTO HOOKS',d:'세션 생명주기 자동 관리'},
  {id:'charter',t:'WORKFLOW\nCHARTER (8)',d:'워크플로우 헌장 8개 조항\n세션/분석/보안/품질 규칙'},
  {id:'projects',t:'PROJECT MAP\n(9 PJ)',d:'IMSMS Core 6개 + 기타 6개\n프로젝트 현황 맵'},
  {id:'files',t:'FILE STRUCT',d:'TP_skills 파일 구조\nindex, projects, reference, templates'},
  {id:'council',t:'MAGI COUNCIL',d:'6축 실시간 토론 시스템\n심의·투표·판정',gid:'council',pg:'council'},
];
L1.forEach(function(n){n.layer=1;n.sz=1.4;n.gid=n.id;n.pg=n.id;ALL.push(n);EDGES.push({a:'system',b:n.id});});

var L2=[
  {id:'melchior',t:'MELCHIOR-1',d:'기술 · 근본을 안 잡으면\n3번 고친다',pg:'magi'},
  {id:'balthazar',t:'BALTHASAR-2',d:'사업 · 그 시간에\n매출을 올려라',pg:'magi'},
  {id:'casper',t:'CASPER-3',d:'현실 · 내일의 나도\n유지할 수 있어야',pg:'magi'},
  {id:'urd',t:'URD-4',d:"기억 · 있었던 것\n기록 안 하면 없었던 것",pg:'norn'},
  {id:'verdandi',t:'VERDANDI-5',d:"검증 · 있는 것\n되는 것 같다 ≠ 진짜 된다",pg:'norn'},
  {id:'skuld',t:'SKULD-6',d:"연결 · 있어야 할 것\n부분 고치면 전체 깨진다",pg:'norn'},
  {id:'ralph_loop',t:'RALPH LOOP',d:'자율 무한 루프 플러그인\nVERDANDI 게이트키퍼',pg:'tools_gov'},
  {id:'simplify',t:'/SIMPLIFY',d:'코드 품질 검토\nMELCHIOR 정 · SKULD 부',pg:'tools_gov'},
  {id:'dev_team',t:'DEV TEAM (4)',d:'코드 구현 담당',pg:'team',sz:1.2},
  {id:'qa_team',t:'QA TEAM (3)',d:'검증 담당\nDEV에 최소 1명 동반',pg:'team',sz:1.2},

// === SPHERE PLACEMENT ===
var RADII=[0,180,340,500];
function placeSphere(nodes,R){
  var phi=(1+Math.sqrt(5))/2;
  nodes.forEach(function(n,i){
    var theta=2*Math.PI*i/phi;var cp=1-(2*(i+0.5))/nodes.length;var sp=Math.sqrt(1-cp*cp);
    n.x=R*sp*Math.cos(theta);n.y=R*cp;n.z=R*sp*Math.sin(theta);
  });
}
NM['system'].x=0;NM['system'].y=0;NM['system'].z=0;
placeSphere(ALL.filter(function(n){return n.layer===1;}),RADII[1]);
function placeNearParent(nodes,R){
  var pgIdx={};
  nodes.forEach(function(n){
    if(!pgIdx[n.pg])pgIdx[n.pg]=0;var idx=pgIdx[n.pg]++;
    var p=NM[n.pg];if(!p){n.x=0;n.y=0;n.z=0;return;}
    var pd=Math.sqrt(p.x*p.x+p.y*p.y+p.z*p.z)||1;
    var bx=p.x/pd,by=p.y/pd,bz=p.z/pd;
    var sib=nodes.filter(function(nn){return nn.pg===n.pg;}).length;
    var ang=(idx/sib)*Math.PI*2;var sp=0.35;
    var ax=0,ay=1,az=0;if(Math.abs(by)>0.9){ax=1;ay=0;az=0;}
    var t1x=by*az-bz*ay,t1y=bz*ax-bx*az,t1z=bx*ay-by*ax;
    var t1d=Math.sqrt(t1x*t1x+t1y*t1y+t1z*t1z)||1;t1x/=t1d;t1y/=t1d;t1z/=t1d;
    var t2x=by*t1z-bz*t1y,t2y=bz*t1x-bx*t1z,t2z=bx*t1y-by*t1x;
    var dx=bx+Math.cos(ang)*sp*t1x+Math.sin(ang)*sp*t2x;
    var dy=by+Math.cos(ang)*sp*t1y+Math.sin(ang)*sp*t2y;
    var dz=bz+Math.cos(ang)*sp*t1z+Math.sin(ang)*sp*t2z;
    var dd=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    n.x=(dx/dd)*R;n.y=(dy/dd)*R;n.z=(dz/dd)*R;
  });
}

function proj(x,y,z){
  var cy=Math.cos(rY),sy=Math.sin(rY),cx=Math.cos(rX),sx=Math.sin(rX);
  var x1=x*cy-z*sy,z1=x*sy+z*cy;var y1=y*cx-z1*sx,z2=y*sx+z1*cx;
  var f=camD/(camD+z2);return{x:x1*f+W/2+pX,y:y1*f+H/2+pY,s:f,z:z2};
}

function hitTest(mx,my){
  var best=null,bestZ=99999;
  ALL.forEach(function(n){if(n._bx===undefined)return;if(mx>=n._bx&&mx<=n._bx+n._bw&&my>=n._by&&my<=n._by+n._bh&&n._pz<bestZ){best=n;bestZ=n._pz;}});
  return best;
}

function draw(){
  time+=0.016;G.clearRect(0,0,W,H);

  // Background
  if(isDark){
    var bg=G.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.75);
    bg.addColorStop(0,'#051510');bg.addColorStop(0.4,'#030e0a');bg.addColorStop(1,'#010403');
    G.fillStyle=bg;G.fillRect(0,0,W,H);
  } else {
    var bg=G.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.75);
    bg.addColorStop(0,'#d8e0dc');bg.addColorStop(0.4,'#c8d2cc');bg.addColorStop(1,'#b8c4be');
    G.fillStyle=bg;G.fillRect(0,0,W,H);
  }

  // Grid overlay (EVA style)
  G.strokeStyle=isDark?'rgba(0,255,200,0.018)':'rgba(0,80,60,0.06)';G.lineWidth=0.5;
  var gs=40;
  for(var gx=0;gx<W;gx+=gs){G.beginPath();G.moveTo(gx,0);G.lineTo(gx,H);G.stroke();}
  for(var gy=0;gy<H;gy+=gs){G.beginPath();G.moveTo(0,gy);G.lineTo(W,gy);G.stroke();}

  // Sphere wireframes — teal glow
  [RADII[1],RADII[2],RADII[3]].forEach(function(R,ri){
    var op=isDark?[0.06,0.04,0.03][ri]:[0.1,0.07,0.05][ri];
    G.strokeStyle=isDark?'rgba(0,255,200,'+op+')':'rgba(0,80,60,'+op+')';G.lineWidth=0.5;
    for(var i=0;i<8;i++){
      var a=i*Math.PI/4;G.beginPath();
      for(var j=0;j<=48;j++){var ph=j/48*Math.PI*2;var p=proj(R*Math.cos(ph)*Math.cos(a),R*Math.sin(ph),R*Math.cos(ph)*Math.sin(a));if(j===0)G.moveTo(p.x,p.y);else G.lineTo(p.x,p.y);}
      G.stroke();
    }
    for(var i=-1;i<=1;i++){
      var lat=i*Math.PI/4;var r=R*Math.cos(lat);var yy=R*Math.sin(lat);G.beginPath();
      for(var j=0;j<=48;j++){var a=j/48*Math.PI*2;var p=proj(r*Math.cos(a),yy,r*Math.sin(a));if(j===0)G.moveTo(p.x,p.y);else G.lineTo(p.x,p.y);}
      G.stroke();
    }
  });

  // Animated ring pulse
  var pulseR=200+Math.sin(time*0.8)*60;
  var pulseOp=0.03+Math.sin(time*0.8)*0.015;
  G.strokeStyle=isDark?'rgba(0,255,200,'+pulseOp+')':'rgba(0,80,60,'+(pulseOp*2)+')';G.lineWidth=1;G.beginPath();
  for(var j=0;j<=48;j++){var a=j/48*Math.PI*2;var p=proj(pulseR*Math.cos(a),0,pulseR*Math.sin(a));if(j===0)G.moveTo(p.x,p.y);else G.lineTo(p.x,p.y);}
  G.stroke();

  ALL.forEach(function(n){var p=proj(n.x,n.y,n.z);n._px=p.x;n._py=p.y;n._ps=p.s;n._pz=p.z;});

  // Edges
  edgesR.forEach(function(e){
    var pa=proj(e.a.x,e.a.y,e.a.z),pb=proj(e.b.x,e.b.y,e.b.z);
    var c=gc(e.a);var as=(pa.s+pb.s)/2;
    var isH=hov&&(e.a.id===hov.id||e.b.id===hov.id);
    var edgeDim=searchMatches.length>0&&searchMatches.indexOf(e.a)===-1&&searchMatches.indexOf(e.b)===-1?0.15:1;
    G.beginPath();G.moveTo(pa.x,pa.y);G.lineTo(pb.x,pb.y);
    var eM=(isDark?1:1.6)*edgeDim;
    if(e.cr){G.setLineDash([2,4]);G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?.6:.15*as*eM)+')';G.lineWidth=(isH?1.5:.4)*as;}
    else{G.setLineDash([]);G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?.7:.25*as*eM)+')';G.lineWidth=(isH?2:.7)*as;}
    G.stroke();G.setLineDash([]);
  });

  var sorted=ALL.slice().sort(function(a,b){return b._pz-a._pz;});

  // Nodes — EVA MAGI style
  sorted.forEach(function(n){
    var c=gc(n);var sc=(n.sz||1)*n._ps;
    if(sc<0.06)return;
    var usageBoost=1;var udata=getUsage(n.id);
    if(udata&&udata.count>0){usageBoost=1+Math.min(0.25,(udata.count/MAX_USAGE)*0.25);}
    var cw=90*sc*usageBoost,ch=40*sc*usageBoost;
    var x=n._px-cw/2,y=n._py-ch/2;
    var alpha=Math.max(0.06,Math.min(1,n._ps*1.3));
    var isH=(hov&&hov.id===n.id)||(searchHighlight&&searchHighlight.id===n.id);
    var isSM=searchMatches.length>0&&searchMatches.indexOf(n)!==-1;
    if(searchMatches.length>0&&!isSM&&!isH){alpha*=0.2;}
    n._bx=x;n._by=y;n._bw=cw;n._bh=ch;

    // EVA card
    if(isDark){
      if(isH){G.shadowColor='rgba('+c[0]+','+c[1]+','+c[2]+',0.4)';G.shadowBlur=20*sc;}
      G.fillStyle='rgba(2,10,8,'+alpha*.88+')';
    } else {
      if(isH){G.shadowColor='rgba('+c[0]+','+c[1]+','+c[2]+',0.3)';G.shadowBlur=16*sc;}
      else{G.shadowColor='rgba(0,0,0,0.12)';G.shadowBlur=6*sc;}
      G.fillStyle='rgba(240,245,242,'+alpha*.96+')';
    }
    rr(x,y,cw,ch,2*sc);G.fill();
    G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?alpha*(isDark?.9:.95):alpha*(isDark?.35:.6))+')';
    G.lineWidth=(isH?1.5:.7)*sc;rr(x,y,cw,ch,2*sc);G.stroke();
    G.shadowColor='transparent';G.shadowBlur=0;

    // Top color bar (EVA style — full color accent with count)
    var barH=8*sc;
    G.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?alpha*(isDark?.7:.9):alpha*(isDark?.4:.75))+')';
    G.fillRect(x+0.5*sc,y+0.5*sc,cw-1*sc,barH);
    // Count text in bar
    if(sc>0.25&&udata&&udata.count>0){
      G.fillStyle=isDark?'rgba(0,0,0,'+alpha*.6+')':'rgba(255,255,255,'+alpha*.95+')';
      G.font='600 '+Math.max(4,5*sc)+'px "Orbitron","Share Tech Mono",monospace';
      G.textAlign='right';
      G.fillText('x'+udata.count,x+cw-3*sc,y+0.5*sc+barH-1.5*sc);
      G.textAlign='left';
    }

    // Corner marks (EVA technical UI)
    if(sc>0.3){
      var cm=4*sc;
      G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+alpha*(isDark?.25:.6)+')';G.lineWidth=(isDark?.5:.7)*sc;
      G.beginPath();G.moveTo(x,y+cm);G.lineTo(x,y);G.lineTo(x+cm,y);G.stroke();
      G.beginPath();G.moveTo(x+cw-cm,y);G.lineTo(x+cw,y);G.lineTo(x+cw,y+cm);G.stroke();
      G.beginPath();G.moveTo(x+cw,y+ch-cm);G.lineTo(x+cw,y+ch);G.lineTo(x+cw-cm,y+ch);G.stroke();
      G.beginPath();G.moveTo(x+cm,y+ch);G.lineTo(x,y+ch);G.lineTo(x,y+ch-cm);G.stroke();
    }

    // (count now shown in top bar)

    // Text — EVA monospace style
    if(sc>0.18){
      if(isDark){G.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+alpha*.9+')';}
      else{G.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+alpha+')';}
      G.font=(isH?'700 ':'600 ')+Math.max(4.5,6.5*sc)+'px "Orbitron","Share Tech Mono",monospace';
      G.textAlign='center';
      var lines=(n.t||'').split('\n');
      var ly=y+barH+4*sc+7*sc;
      for(var i=0;i<lines.length;i++){
        G.fillText(lines[i],n._px,ly+8*sc*i,cw-6*sc);
      }
      G.textAlign='left';
    }
  });

  // Center crosshair
  var cx=W/2+pX,cy=H/2+pY;
  G.strokeStyle=isDark?'rgba(0,255,200,0.06)':'rgba(0,80,60,0.1)';G.lineWidth=0.5;
  G.beginPath();G.moveTo(cx-15,cy);G.lineTo(cx+15,cy);G.stroke();
  G.beginPath();G.moveTo(cx,cy-15);G.lineTo(cx,cy+15);G.stroke();
}

function rr(x,y,w,h,r){G.beginPath();G.moveTo(x+r,y);G.lineTo(x+w-r,y);G.quadraticCurveTo(x+w,y,x+w,y+r);G.lineTo(x+w,y+h-r);G.quadraticCurveTo(x+w,y+h,x+w-r,y+h);G.lineTo(x+r,y+h);G.quadraticCurveTo(x,y+h,x,y+h-r);G.lineTo(x,y+r);G.quadraticCurveTo(x,y,x+r,y);G.closePath();}

// Interaction
var drag=false,rdrag=false,lx=0,ly=0;
C.addEventListener('mousedown',function(e){lx=e.clientX;ly=e.clientY;if(e.button===2)rdrag=true;else drag=true;});
C.addEventListener('mousemove',function(e){
  var dx=e.clientX-lx,dy=e.clientY-ly;
  if(drag){rY+=dx*.005;rX+=dy*.005;rX=Math.max(-1.5,Math.min(1.5,rX));}
  else if(rdrag){pX+=dx;pY+=dy;}
  else{
    var h=hitTest(e.clientX,e.clientY);hov=h;
    if(h){
      tip.style.display='block';tip.style.left=(e.clientX+16)+'px';tip.style.top=(e.clientY-10)+'px';
      var udata=getUsage(h.id);var usageHtml='';
      if(udata&&udata.count>0){
        var pct=Math.round((udata.count/MAX_USAGE)*100);
        usageHtml='<div class="tp-usage"><span>REF '+udata.count+'x</span><div class="tp-bar"><div class="tp-fill" style="width:'+pct+'%"></div></div></div>';
      }
      var c=gc(h);
      tip.innerHTML='<div class="tp-group">'+(h.pg||'').toUpperCase()+'</div><div class="tp-title" style="color:rgba('+c[0]+','+c[1]+','+c[2]+',0.95);text-shadow:0 0 8px rgba('+c[0]+','+c[1]+','+c[2]+',0.3)">'+(h.t||'').replace(/\n/g,' ')+'</div>'+(h.d?'<div class="tp-desc">'+h.d.replace(/\n/g,' · ')+'</div>':'')+usageHtml;
      C.style.cursor='pointer';
    }
    else{tip.style.display='none';C.style.cursor='crosshair';}
  }
  lx=e.clientX;ly=e.clientY;
});
C.addEventListener('mouseup',function(){drag=false;rdrag=false;});
C.addEventListener('mouseleave',function(){drag=false;rdrag=false;});
C.addEventListener('contextmenu',function(e){e.preventDefault();});
C.addEventListener('wheel',function(e){e.preventDefault();camD=Math.max(300,Math.min(2500,camD+e.deltaY*.7));},{passive:false});

function toggleRot(){aRot=!aRot;document.getElementById('bRot').classList.toggle('on',aRot);}
function resetCam(){camD=900;rX=-0.15;rY=0.3;pX=0;pY=0;aRot=true;document.getElementById('bRot').classList.add('on');}

// Legend
var legNames={magi:'MAGI',norn:'NORN',tools_gov:'TOOLS',dev_team:'DEV',qa_team:'QA',pm_team:'PM',process:'PROC',ceo_rules:'CEO',hooks:'HOOK',charter:'CHART',projects:'PJ',files:'FILE',council:'COUNCIL'};
var leg=document.getElementById('leg');
Object.keys(legNames).forEach(function(k){var c=COL[k]||[0,255,200];var d=document.createElement('div');d.className='li';d.innerHTML='<div class="ld" style="background:rgb('+c+');box-shadow:0 0 4px rgba('+c+',0.4)"></div>'+legNames[k];leg.appendChild(d);});

// === AUTO SHOWCASE (30s idle) ===
var idleTime=0,showcaseActive=false,showcaseIdx=0,showcaseTimer=null;
var SHOWCASE_NODES=[];
function buildShowcaseList(){
  SHOWCASE_NODES=[];
  // L1 nodes first
  L1.forEach(function(n){SHOWCASE_NODES.push(n.id);});
  // Then nodes with usage data (sorted by count desc)
  var usedNodes=[];
  ALL.forEach(function(n){var u=getUsage(n.id);if(u&&u.count>0&&SHOWCASE_NODES.indexOf(n.id)===-1)usedNodes.push({id:n.id,count:u.count});});
  usedNodes.sort(function(a,b){return b.count-a.count;});
  usedNodes.forEach(function(u){SHOWCASE_NODES.push(u.id);});
  // Add some interesting L2/L3 nodes
  ['melchior','balthazar','casper','urd','verdandi','skuld','ralph_loop','simplify','ag_anchor','ag_jungsuk','ag_haneul','ag_gate','step1','step3','step5'].forEach(function(id){
    if(SHOWCASE_NODES.indexOf(id)===-1)SHOWCASE_NODES.push(id);
  });
}
function resetIdle(){
  idleTime=0;
  if(showcaseActive){
    showcaseActive=false;hov=null;tip.style.display='none';
    C.style.cursor='crosshair';
  }
}
function showcaseNext(){
  if(!showcaseActive)return;
  if(SHOWCASE_NODES.length===0)buildShowcaseList();
  var nid=SHOWCASE_NODES[showcaseIdx%SHOWCASE_NODES.length];
  var n=NM[nid];if(!n){showcaseIdx++;return;}
  hov=n;
  // Smoothly rotate camera toward this node
  var targetRY=Math.atan2(n.x,n.z);
  var targetRX=-Math.asin(n.y/(Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1));
  // Lerp toward target
  var dY=targetRY-rY;while(dY>Math.PI)dY-=2*Math.PI;while(dY<-Math.PI)dY+=2*Math.PI;
  rY+=dY*0.08;rX+=(targetRX-rX)*0.08;
  // Show tooltip at node screen position
  if(n._px!==undefined){
    tip.style.display='block';
    var tx=Math.min(W-320,Math.max(10,n._px+40));
    var ty=Math.min(H-120,Math.max(10,n._py-20));
    tip.style.left=tx+'px';tip.style.top=ty+'px';
    var udata=getUsage(n.id);var usageHtml='';
    if(udata&&udata.count>0){
      var pct=Math.round((udata.count/MAX_USAGE)*100);
      usageHtml='<div class="tp-usage"><span>REF '+udata.count+'x</span><div class="tp-bar"><div class="tp-fill" style="width:'+pct+'%"></div></div></div>';
    }
    var c=gc(n);
    tip.innerHTML='<div class="tp-group">'+(n.pg||'').toUpperCase()+'</div><div class="tp-title" style="color:rgba('+c[0]+','+c[1]+','+c[2]+',0.95);text-shadow:0 0 8px rgba('+c[0]+','+c[1]+','+c[2]+',0.3)">'+(n.t||'').replace(/\n/g,' ')+'</div>'+(n.d?'<div class="tp-desc">'+n.d.replace(/\n/g,' · ')+'</div>':'')+usageHtml;
    C.style.cursor='pointer';
  }
  showcaseIdx++;
}
// Idle detection — reset on any interaction
['mousemove','mousedown','wheel','keydown','touchstart'].forEach(function(evt){
  window.addEventListener(evt,function(e){if(e.target!==searchInput)resetIdle();},{passive:true});
});
// Start showcase immediately on load
buildShowcaseList();showcaseActive=true;showcaseIdx=0;
aRot=true;document.getElementById('bRot').classList.add('on');
// First node after 2s (let scene render first)
setTimeout(function(){if(showcaseActive)showcaseNext();},2000);
// Check idle every second — restart showcase after 30s idle
setInterval(function(){
  idleTime++;
  if(!showcaseActive&&idleTime>=30){
    showcaseActive=true;showcaseIdx=0;buildShowcaseList();
    aRot=true;document.getElementById('bRot').classList.add('on');
    showcaseNext();
  }
},1000);
// Cycle showcase node every 4 seconds
setInterval(function(){if(showcaseActive)showcaseNext();},4000);

// === SEARCH ===
var searchInput=document.getElementById('search-input');
var searchResults=document.getElementById('search-results');
var searchCount=document.getElementById('search-count');
var searchMatches=[];var searchHighlight=null;
function doSearch(q){
  searchMatches=[];searchHighlight=null;
  if(!q||q.length<1){searchResults.style.display='none';searchCount.textContent='';return;}
  q=q.toLowerCase();
  ALL.forEach(function(n){
    var txt=((n.t||'')+' '+(n.d||'')+' '+n.id).toLowerCase();
    if(txt.indexOf(q)!==-1)searchMatches.push(n);
  });
  searchCount.textContent=searchMatches.length+' FOUND';
  if(searchMatches.length===0){searchResults.style.display='none';return;}
  searchResults.style.display='block';
  searchResults.innerHTML='';
  searchMatches.forEach(function(n){
    var c=gc(n);var div=document.createElement('div');div.className='sr-item';
    div.innerHTML='<div class="sr-dot" style="background:rgb('+c+')"></div><span class="sr-name">'+(n.t||'').replace(/\n/g,' ')+'</span><span class="sr-layer">L'+n.layer+'</span>';
    div.addEventListener('click',function(){navigateToNode(n);searchResults.style.display='none';searchInput.blur();});
    searchResults.appendChild(div);
  });
}
searchInput.addEventListener('input',function(){doSearch(this.value);});
searchInput.addEventListener('focus',function(){resetIdle();if(this.value)doSearch(this.value);});
searchInput.addEventListener('keydown',function(e){
  if(e.key==='Escape'){this.value='';doSearch('');this.blur();searchHighlight=null;}
  if(e.key==='Enter'&&searchMatches.length>0){navigateToNode(searchMatches[0]);searchResults.style.display='none';}
});
document.addEventListener('click',function(e){if(!searchResults.contains(e.target)&&e.target!==searchInput)searchResults.style.display='none';});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();searchInput.focus();searchInput.select();}});
function navigateToNode(n){
  resetIdle();showcaseActive=false;searchHighlight=n;hov=n;
  var dist=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z);
  camD=Math.max(400,dist+350);
  var targetRY=Math.atan2(n.x,n.z);var targetRX=-Math.asin(n.y/(dist||1));
  rY=targetRY;rX=targetRX;
  // Update outline active
  document.querySelectorAll('.ol-item.active,.ol-group-hdr.active').forEach(function(el){el.classList.remove('active');});
  var olEl=document.querySelector('[data-ol-id="'+n.id+'"]');
  if(olEl){olEl.classList.add('active');
    // Expand parent groups
    var pg=olEl.closest('.ol-children');while(pg){pg.classList.add('open');var arr=pg.previousElementSibling;if(arr)arr.querySelector('.ol-arrow').classList.add('open');pg=pg.parentElement.closest('.ol-children');}
  }
}

// === OUTLINE PANEL ===
var outlineOpen=false;
function toggleOutline(){
  outlineOpen=!outlineOpen;
  document.getElementById('outline-panel').classList.toggle('open',outlineOpen);
  document.getElementById('bOutline').classList.toggle('on',outlineOpen);
}
function buildOutline(){
  var tree=document.getElementById('outline-tree');tree.innerHTML='';
  // Build hierarchy: system -> L1 -> L2 children -> L3 children
  function getChildren(parentId,pool){return pool.filter(function(n){return n.pg===parentId;});}
  L1.forEach(function(l1n){
    var grp=document.createElement('div');grp.className='ol-group';
    var c=gc(l1n);
    var hdr=document.createElement('div');hdr.className='ol-group-hdr';hdr.setAttribute('data-ol-id',l1n.id);
    hdr.innerHTML='<span class="ol-arrow">&#9654;</span><div class="ol-dot" style="background:rgb('+c+')"></div>'+(l1n.t||'').replace(/\n/g,' ');
    var children=document.createElement('div');children.className='ol-children';
    // L2 children
    var l2kids=getChildren(l1n.id,L2);
    l2kids.forEach(function(l2n){
      var c2=gc(l2n);
      // Check if this L2 has L3 children (in L2 array with pg=l2n.id, or in L3 array)
      var l3kids=getChildren(l2n.id,L2).concat(getChildren(l2n.id,L3));
      if(l3kids.length>0){
        var subGrp=document.createElement('div');subGrp.className='ol-group';
        var subHdr=document.createElement('div');subHdr.className='ol-group-hdr ol-item';subHdr.setAttribute('data-ol-id',l2n.id);
        subHdr.innerHTML='<span class="ol-arrow">&#9654;</span><div class="ol-dot" style="background:rgb('+c2+')"></div>'+(l2n.t||'').replace(/\n/g,' ');
        var subChildren=document.createElement('div');subChildren.className='ol-children ol-sub';
        l3kids.forEach(function(l3n){
          var c3=gc(l3n);
          var item=document.createElement('div');item.className='ol-item';item.setAttribute('data-ol-id',l3n.id);
          item.innerHTML='<div class="ol-dot" style="background:rgb('+c3+')"></div>'+(l3n.t||'').replace(/\n/g,' ');
          item.addEventListener('click',function(e){e.stopPropagation();navigateToNode(l3n);});
          subChildren.appendChild(item);
        });
        subHdr.addEventListener('click',function(e){
          e.stopPropagation();
          var isOpen=subChildren.classList.toggle('open');
          subHdr.querySelector('.ol-arrow').classList.toggle('open',isOpen);
          navigateToNode(l2n);
        });
        subGrp.appendChild(subHdr);subGrp.appendChild(subChildren);
        children.appendChild(subGrp);
      } else {
        var item=document.createElement('div');item.className='ol-item';item.setAttribute('data-ol-id',l2n.id);
        item.innerHTML='<div class="ol-dot" style="background:rgb('+c2+')"></div>'+(l2n.t||'').replace(/\n/g,' ');
        item.addEventListener('click',function(){navigateToNode(l2n);});
        children.appendChild(item);
      }
    });
    // L3 children directly under L1 (if any)
    var l3direct=getChildren(l1n.id,L3);
    l3direct.forEach(function(l3n){
      var c3=gc(l3n);
      var item=document.createElement('div');item.className='ol-item';item.setAttribute('data-ol-id',l3n.id);
      item.innerHTML='<div class="ol-dot" style="background:rgb('+c3+')"></div>'+(l3n.t||'').replace(/\n/g,' ');
      item.addEventListener('click',function(){navigateToNode(l3n);});
      children.appendChild(item);
    });
    hdr.addEventListener('click',function(){
      var isOpen=children.classList.toggle('open');
      hdr.querySelector('.ol-arrow').classList.toggle('open',isOpen);
      navigateToNode(l1n);
    });
    grp.appendChild(hdr);grp.appendChild(children);tree.appendChild(grp);
  });
}
buildOutline();

function loop(){
  if(aRot)rY+=.002;
  // Smooth camera lerp for showcase
  if(showcaseActive&&hov){
    var n=hov;
    var targetRY=Math.atan2(n.x,n.z);
    var targetRX=-Math.asin(n.y/(Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1));
    var dY=targetRY-rY;while(dY>Math.PI)dY-=2*Math.PI;while(dY<-Math.PI)dY+=2*Math.PI;
    rY+=dY*0.03;rX+=(targetRX-rX)*0.03;
    // Update tooltip position each frame
    if(n._px!==undefined){
      var tx=Math.min(W-320,Math.max(10,n._px+40));
      var ty=Math.min(H-120,Math.max(10,n._py-20));
      tip.style.left=tx+'px';tip.style.top=ty+'px';
    }
  }
  draw();requestAnimationFrame(loop);
}
loop();

var USAGE={};
var MAX_USAGE=1;
(function loadUsage(){
  var x=new XMLHttpRequest();
  x.open('GET','skill_usage.json?t='+Date.now(),true);
  x.onload=function(){
    if(x.status===200){
      try{
        var d=JSON.parse(x.responseText);
        USAGE=d.skills||{};
        var mx=1;
        for(var k in USAGE){if(USAGE[k].count>mx)mx=USAGE[k].count;}
        MAX_USAGE=mx;
      }catch(e){}
    }
  };
  x.send();
})();

L3.forEach(function(n){n.layer=3;n.sz=n.sz||0.85;n.gid=n.id;ALL.push(n);EDGES.push({a:n.pg,b:n.id});});

var CROSS=[
  ['step1','ag_anchor','ANCHOR가 접수'],['step2','ceo9','오지시 방어'],
  ['step3','dev_team','DEV 투입'],['step3','qa_team','QA 동시 투입'],
  ['step4','qa_system','QA 체계 적용'],['step5','ceo6','결론 먼저'],
  ['step6','ag_scribe','SCRIBE 기록'],['dp5','magi','MAGI 토론'],
  ['ag_anchor','ceo_rules','CEO 원칙'],['ag_scribe','f7','CHANGELOG'],
  ['ag_gate','wf6','보안 근본원인'],['ag_probe','wf7','회귀 테스트'],
  ['ag_jungsuk','wf4','Contract-First'],['qa2','ag_haneul','Playwright'],
  ['hook2','pj50','Session Manager'],['ceo5','wf7','회귀=fix품질'],
  ['pj01','ag_haneul','Frontend'],['pj02','ag_jungsuk','Backend'],
  ['pj03','ag_minsoo','Native'],['pj36','ag_minsoo','Native'],
  ['ps1','ag_jungsuk'],['ps1','ag_gate'],['ps1','ag_scout'],
  ['ps2','ag_haneul'],['ps2','ag_probe'],['ps2','ag_perf'],
  ['ps3','ag_jungsuk'],['ps3','ag_haneul'],['ps3','ag_probe'],['ps3','ag_anchor'],
  ['ps5','ag_chulsoo'],['ps5','ag_gate'],
];
CROSS.forEach(function(c){EDGES.push({a:c[0],b:c[1],cr:1,label:c[2]||''});});

var NM={};ALL.forEach(function(n){NM[n.id]=n;});

// === SPHERE PLACEMENT ===
var RADII=[0,180,340,500];

function placeSphere(nodes,R){
  var phi=(1+Math.sqrt(5))/2;
  nodes.forEach(function(n,i){
    var theta=2*Math.PI*i/phi;
    var cp=1-(2*(i+0.5))/nodes.length;
    var sp=Math.sqrt(1-cp*cp);
    n.x=R*sp*Math.cos(theta);n.y=R*cp;n.z=R*sp*Math.sin(theta);
  });
}
NM['system'].x=0;NM['system'].y=0;NM['system'].z=0;
placeSphere(ALL.filter(function(n){return n.layer===1;}),RADII[1]);

function placeNearParent(nodes,R){
  var pgIdx={};
  nodes.forEach(function(n){
    if(!pgIdx[n.pg])pgIdx[n.pg]=0;
    var idx=pgIdx[n.pg]++;
    var p=NM[n.pg];if(!p){n.x=0;n.y=0;n.z=0;return;}
    var pd=Math.sqrt(p.x*p.x+p.y*p.y+p.z*p.z)||1;
    var bx=p.x/pd,by=p.y/pd,bz=p.z/pd;
    var sib=nodes.filter(function(nn){return nn.pg===n.pg;}).length;
    var ang=(idx/sib)*Math.PI*2;var sp=0.35;
    var ax=0,ay=1,az=0;if(Math.abs(by)>0.9){ax=1;ay=0;az=0;}
    var t1x=by*az-bz*ay,t1y=bz*ax-bx*az,t1z=bx*ay-by*ax;
    var t1d=Math.sqrt(t1x*t1x+t1y*t1y+t1z*t1z)||1;
    t1x/=t1d;t1y/=t1d;t1z/=t1d;
    var t2x=by*t1z-bz*t1y,t2y=bz*t1x-bx*t1z,t2z=bx*t1y-by*t1x;
    var dx=bx+Math.cos(ang)*sp*t1x+Math.sin(ang)*sp*t2x;
    var dy=by+Math.cos(ang)*sp*t1y+Math.sin(ang)*sp*t2y;
    var dz=bz+Math.cos(ang)*sp*t1z+Math.sin(ang)*sp*t2z;
    var dd=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    n.x=(dx/dd)*R;n.y=(dy/dd)*R;n.z=(dz/dd)*R;
  });
}
placeNearParent(ALL.filter(function(n){return n.layer===2;}),RADII[2]);
placeNearParent(ALL.filter(function(n){return n.layer===3;}),RADII[3]);

var edgesR=EDGES.map(function(e){return{a:NM[e.a],b:NM[e.b],cr:e.cr||0,label:e.label||''};}).filter(function(e){return e.a&&e.b;});

// Camera
var camD=900,rX=-0.15,rY=0.3,pX=0,pY=0,aRot=true;
var time=0;

function proj(x,y,z){
  var cy=Math.cos(rY),sy=Math.sin(rY),cx=Math.cos(rX),sx=Math.sin(rX);
  var x1=x*cy-z*sy,z1=x*sy+z*cy;
  var y1=y*cx-z1*sx,z2=y*sx+z1*cx;
  var f=camD/(camD+z2);
  return{x:x1*f+W/2+pX,y:y1*f+H/2+pY,s:f,z:z2};
}

var hov=null,tip=document.getElementById('tip');

function hitTest(mx,my){
  var best=null,bestZ=99999;
  ALL.forEach(function(n){
    if(n._bx===undefined)return;
    if(mx>=n._bx&&mx<=n._bx+n._bw&&my>=n._by&&my<=n._by+n._bh&&n._pz<bestZ){best=n;bestZ=n._pz;}
  });
  return best;
}

function draw(){
  time+=0.016;
  G.clearRect(0,0,W,H);

  // Background
  if(isDark){
    var bg=G.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.7);
    bg.addColorStop(0,'#08081a');bg.addColorStop(0.5,'#040410');bg.addColorStop(1,'#010104');
    G.fillStyle=bg;G.fillRect(0,0,W,H);
    // Stars
    STARS.forEach(function(s){
      var p=proj(s.x*800,s.y*800,s.z*800);
      if(p.z>-camD){
        var twinkle=s.b*(0.7+0.3*Math.sin(time*2+s.x*10));
        G.fillStyle='rgba(180,190,255,'+twinkle+')';
        G.beginPath();G.arc(p.x,p.y,s.s*p.s,0,Math.PI*2);G.fill();
      }
    });
  } else {
    var bg=G.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.7);
    bg.addColorStop(0,'#f4f6fb');bg.addColorStop(0.5,'#eceef5');bg.addColorStop(1,'#e0e3ed');
    G.fillStyle=bg;G.fillRect(0,0,W,H);
  }

  // Sphere wireframes with glow
  [RADII[1],RADII[2],RADII[3]].forEach(function(R,ri){
    var op=isDark?[0.05,0.035,0.025][ri]:[0.06,0.04,0.03][ri];
    var wc=isDark?'100,100,200':'120,120,180';
    G.strokeStyle='rgba('+wc+','+op+')';G.lineWidth=0.5;
    for(var i=0;i<8;i++){
      var a=i*Math.PI/4;G.beginPath();
      for(var j=0;j<=48;j++){var ph=j/48*Math.PI*2;var p=proj(R*Math.cos(ph)*Math.cos(a),R*Math.sin(ph),R*Math.cos(ph)*Math.sin(a));if(j===0)G.moveTo(p.x,p.y);else G.lineTo(p.x,p.y);}
      G.stroke();
    }
    for(var i=-1;i<=1;i++){
      var lat=i*Math.PI/4;var r=R*Math.cos(lat);var yy=R*Math.sin(lat);
      G.beginPath();
      for(var j=0;j<=48;j++){var a=j/48*Math.PI*2;var p=proj(r*Math.cos(a),yy,r*Math.sin(a));if(j===0)G.moveTo(p.x,p.y);else G.lineTo(p.x,p.y);}
      G.stroke();
    }
  });

  ALL.forEach(function(n){var p=proj(n.x,n.y,n.z);n._px=p.x;n._py=p.y;n._ps=p.s;n._pz=p.z;});

  // Edges
  edgesR.forEach(function(e){
    var pa=proj(e.a.x,e.a.y,e.a.z),pb=proj(e.b.x,e.b.y,e.b.z);
    var c=gc(e.a);var as=(pa.s+pb.s)/2;
    var isH=hov&&(e.a.id===hov.id||e.b.id===hov.id);
    G.beginPath();G.moveTo(pa.x,pa.y);G.lineTo(pb.x,pb.y);
    if(isDark){
      if(e.cr){G.setLineDash([2,4]);G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?.65:.2*as)+')';G.lineWidth=(isH?1.5:.5)*as;}
      else{G.setLineDash([]);G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?.75:.3*as)+')';G.lineWidth=(isH?2:0.8)*as;}
    } else {
      if(e.cr){G.setLineDash([2,4]);G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?.5:.15*as)+')';G.lineWidth=(isH?1.5:.6)*as;}
      else{G.setLineDash([]);G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?.6:.22*as)+')';G.lineWidth=(isH?2:0.9)*as;}
    }
    G.stroke();G.setLineDash([]);
  });

  var sorted=ALL.slice().sort(function(a,b){return b._pz-a._pz;});

  // Nodes
  sorted.forEach(function(n){
    var c=gc(n);var sc=(n.sz||1)*n._ps;
    if(sc<0.06)return;

    // Usage boost: nodes with higher usage are slightly larger
    var usageBoost=1;
    var udata=getUsage(n.id);
    if(udata&&udata.count>0){usageBoost=1+Math.min(0.3,(udata.count/MAX_USAGE)*0.3);}

    var cw=88*sc*usageBoost,ch=34*sc*usageBoost;
    var x=n._px-cw/2,y=n._py-ch/2;
    var alpha=Math.max(0.06,Math.min(1,n._ps*1.3));
    var isH=hov&&hov.id===n.id;
    n._bx=x;n._by=y;n._bw=cw;n._bh=ch;

    if(isDark){
      // Dark: glass card
      if(isH){G.shadowColor='rgba('+c[0]+','+c[1]+','+c[2]+',0.5)';G.shadowBlur=20*sc;}
      G.fillStyle='rgba('+Math.floor(c[0]*.15)+','+Math.floor(c[1]*.15)+','+Math.floor(c[2]*.15)+','+alpha*.8+')';
      rr(x,y,cw,ch,4*sc);G.fill();
      G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?alpha*.8:alpha*.3)+')';
      G.lineWidth=(isH?1.5:.6)*sc;rr(x,y,cw,ch,4*sc);G.stroke();
      G.shadowColor='transparent';G.shadowBlur=0;
      // Top accent
      var tg=G.createLinearGradient(x,y,x+cw,y);
      tg.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+alpha*.3+')');
      tg.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+','+alpha*.08+')');
      G.fillStyle=tg;rrTop(x,y,cw,Math.min(ch*.3,10*sc),4*sc);G.fill();
      // Usage indicator dot
      if(udata&&udata.count>0){
        var dotR=Math.max(1.5,2.5*sc);
        var intensity=udata.count/MAX_USAGE;
        G.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(0.3+intensity*0.6)+')';
        G.beginPath();G.arc(x+cw-6*sc,y+6*sc,dotR,0,Math.PI*2);G.fill();
      }
      if(sc>0.2){
        G.fillStyle='rgba(255,255,255,'+alpha*.88+')';
        G.font=(isH?'600 ':'500 ')+Math.max(5,7*sc)+'px -apple-system,sans-serif';
        G.textAlign='center';
        var lines=(n.t||'').split('\n');
        for(var i=0;i<lines.length;i++){G.fillText(lines[i],n._px,y+10*sc+9*sc*(i+1),cw-6*sc);}
        G.textAlign='left';
      }
    } else {
      // Light: white card with subtle shadow
      if(isH){G.shadowColor='rgba('+c[0]+','+c[1]+','+c[2]+',0.2)';G.shadowBlur=16*sc;}
      else{G.shadowColor='rgba(0,0,0,0.06)';G.shadowBlur=6*sc;}
      G.fillStyle='rgba(255,255,255,'+alpha*.95+')';
      rr(x,y,cw,ch,4*sc);G.fill();
      G.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(isH?alpha*.6:alpha*.2)+')';
      G.lineWidth=(isH?1.5:.6)*sc;rr(x,y,cw,ch,4*sc);G.stroke();
      G.shadowColor='transparent';G.shadowBlur=0;
      // Top accent
      var tg=G.createLinearGradient(x,y,x+cw,y);
      tg.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+alpha*.18+')');
      tg.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+','+alpha*.04+')');
      G.fillStyle=tg;rrTop(x,y,cw,Math.min(ch*.3,10*sc),4*sc);G.fill();
      // Usage indicator
      if(udata&&udata.count>0){
        var dotR=Math.max(1.5,2.5*sc);
        var intensity=udata.count/MAX_USAGE;
        G.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(0.2+intensity*0.5)+')';
        G.beginPath();G.arc(x+cw-6*sc,y+6*sc,dotR,0,Math.PI*2);G.fill();
      }
      if(sc>0.2){
        G.fillStyle='rgba('+Math.floor(c[0]*.35)+','+Math.floor(c[1]*.35)+','+Math.floor(c[2]*.35)+','+alpha*.95+')';
        G.font=(isH?'600 ':'500 ')+Math.max(5,7*sc)+'px -apple-system,sans-serif';
        G.textAlign='center';
        var lines=(n.t||'').split('\n');
        for(var i=0;i<lines.length;i++){G.fillText(lines[i],n._px,y+10*sc+9*sc*(i+1),cw-6*sc);}
        G.textAlign='left';
      }
    }
  });
}

function rr(x,y,w,h,r){G.beginPath();G.moveTo(x+r,y);G.lineTo(x+w-r,y);G.quadraticCurveTo(x+w,y,x+w,y+r);G.lineTo(x+w,y+h-r);G.quadraticCurveTo(x+w,y+h,x+w-r,y+h);G.lineTo(x+r,y+h);G.quadraticCurveTo(x,y+h,x,y+h-r);G.lineTo(x,y+r);G.quadraticCurveTo(x,y,x+r,y);G.closePath();}
function rrTop(x,y,w,h,r){G.beginPath();G.moveTo(x+r,y);G.lineTo(x+w-r,y);G.quadraticCurveTo(x+w,y,x+w,y+r);G.lineTo(x+w,y+h);G.lineTo(x,y+h);G.lineTo(x,y+r);G.quadraticCurveTo(x,y,x+r,y);G.closePath();}

// Interaction
var drag=false,rdrag=false,lx=0,ly=0;
C.addEventListener('mousedown',function(e){lx=e.clientX;ly=e.clientY;if(e.button===2)rdrag=true;else drag=true;aRot=false;document.getElementById('bRot').classList.remove('on');});
C.addEventListener('mousemove',function(e){
  var dx=e.clientX-lx,dy=e.clientY-ly;
  if(drag){rY+=dx*.005;rX+=dy*.005;rX=Math.max(-1.5,Math.min(1.5,rX));}
  else if(rdrag){pX+=dx;pY+=dy;}
  else{
    var h=hitTest(e.clientX,e.clientY);hov=h;
    if(h){
      tip.style.display='block';tip.style.left=(e.clientX+16)+'px';tip.style.top=(e.clientY-10)+'px';
      var udata=getUsage(h.id);
      var usageHtml='';
      if(udata&&udata.count>0){
        var pct=Math.round((udata.count/MAX_USAGE)*100);
        var c=gc(h);
        usageHtml='<div class="tp-usage"><span>참조 '+udata.count+'회</span><div class="tp-bar"><div class="tp-fill" style="width:'+pct+'%;background:rgb('+c+')"></div></div></div>';
      }
      tip.innerHTML='<div class="tp-group">'+(h.pg||'')+'</div><div class="tp-title">'+(h.t||'').replace(/\n/g,' ')+'</div>'+(h.d?'<div class="tp-desc">'+h.d.replace(/\n/g,' · ')+'</div>':'')+usageHtml;
      C.style.cursor='pointer';
    }
    else{tip.style.display='none';C.style.cursor='grab';}
  }
  lx=e.clientX;ly=e.clientY;
});
C.addEventListener('mouseup',function(){drag=false;rdrag=false;});
C.addEventListener('mouseleave',function(){drag=false;rdrag=false;});
C.addEventListener('contextmenu',function(e){e.preventDefault();});
C.addEventListener('wheel',function(e){e.preventDefault();camD=Math.max(300,Math.min(2500,camD+e.deltaY*.7));},{passive:false});

function toggleRot(){aRot=!aRot;document.getElementById('bRot').classList.toggle('on',aRot);}
function resetCam(){camD=900;rX=-0.15;rY=0.3;pX=0;pY=0;aRot=true;document.getElementById('bRot').classList.add('on');}

// Legend
var legNames={magi:'MAGI',dev_team:'DEV',qa_team:'QA',pm_team:'PM',process:'Process',ceo_rules:'CEO',hooks:'Hook',charter:'Charter',projects:'Project',files:'Files',presets:'Preset'};
var leg=document.getElementById('leg');
Object.keys(legNames).forEach(function(k){var c=COL[k]||[120,120,170];var d=document.createElement('div');d.className='li';d.innerHTML='<div class="ld" style="background:rgb('+c+')"></div>'+legNames[k];leg.appendChild(d);});

function loop(){if(aRot)rY+=.0025;draw();requestAnimationFrame(loop);}
loop();
</script>
